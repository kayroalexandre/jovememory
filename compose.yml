name: jovememory-dev
services:
  postgres:
    image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: jovememory_owner
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Run npm run local:init}
      POSTGRES_DB: jovememory_dev
    ports:
      - '127.0.0.1:55471:5432'
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jovememory_owner -d jovememory_dev']
      interval: 2s
      timeout: 2s
      retries: 30
  storage:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run npm run local:init}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run npm run local:init}
    ports:
      - '127.0.0.1:59071:8333'
    volumes:
      - storage_dev_seaweed:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status']
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  postgres_dev:
  storage_dev_seaweed:
