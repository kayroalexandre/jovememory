name: jovememory-dev
services:
  postgres:
    image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: jovememory_owner
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Run npm run local:init}
      POSTGRES_DB: jovememory_dev
    ports:
      - '127.0.0.1:55471:5432'
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jovememory_owner -d jovememory_dev']
      interval: 2s
      timeout: 2s
      retries: 30
  storage:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Run npm run local:init}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Run npm run local:init}
    ports:
      - '127.0.0.1:59071:9000'
    volumes:
      - storage_dev:/data
volumes:
  postgres_dev:
  storage_dev:
